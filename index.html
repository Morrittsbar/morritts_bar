<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test Direct Imports</title>
</head>
<body style="background:#0b1220;color:#fff;font-family:sans-serif;padding:30px">
<div id="root" style="font-size:20px">Loading...</div>

<script type="module">
document.getElementById('root').textContent = 'Step 1: module started'

try {
  const React = (await import('https://esm.sh/react@18.3.1')).default
  document.getElementById('root').textContent = 'Step 2: React loaded'

  const { createRoot } = await import('https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1')
  document.getElementById('root').textContent = 'Step 3: ReactDOM loaded'

  const htm = (await import('https://esm.sh/htm@3.1.1')).default
  const html = htm.bind(React.createElement)

  document.getElementById('root').textContent = 'Step 4: all libs loaded, rendering'

  createRoot(document.getElementById('root')).render(
    html`<div>
      <h1 style="color:#3ddc97">✅ React + GitHub Pages works!</h1>
      <p>The module script is running correctly.</p>
      <p>Now we can drop in the full Bar Control app.</p>
    </div>`
  )
} catch (e) {
  document.getElementById('root').innerHTML =
    '<pre style="color:#ff5c5c;white-space:pre-wrap;font-size:14px">ERROR:\n' +
    e.message + '\n\n' + e.stack + '</pre>'
}
</script>
</body>
</html>
