<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Library Test</title>
</head>
<body style="background:#0b1220;color:#fff;font-family:monospace;padding:30px;font-size:18px;line-height:2">
<div id="status">Starting...</div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script>
setTimeout(function() {
  var ReactOK    = typeof React !== 'undefined' ? 'OK' : 'MISSING';
  var ReactDOMOK = typeof ReactDOM !== 'undefined' ? 'OK' : 'MISSING';
  var htmOK      = typeof htm !== 'undefined' ? 'OK' : 'MISSING';
  var supabaseOK = typeof supabase !== 'undefined' ? 'OK' : 'MISSING';

  var allOK = ReactOK === 'OK' && ReactDOMOK === 'OK' && htmOK === 'OK' && supabaseOK === 'OK';

  document.getElementById('status').innerHTML =
    '<h2 style="color:' + (allOK ? '#3ddc97' : '#ff5c5c') + '">' +
    (allOK ? '✅ ALL LIBRARIES LOADED' : '❌ SOME LIBRARIES FAILED') +
    '</h2>' +
    '<div>React:    <span style="color:' + (ReactOK==='OK'?'#3ddc97':'#ff5c5c') + '">' + ReactOK + '</span></div>' +
    '<div>ReactDOM: <span style="color:' + (ReactDOMOK==='OK'?'#3ddc97':'#ff5c5c') + '">' + ReactDOMOK + '</span></div>' +
    '<div>htm:      <span style="color:' + (htmOK==='OK'?'#3ddc97':'#ff5c5c') + '">' + htmOK + '</span></div>' +
    '<div>supabase: <span style="color:' + (supabaseOK==='OK'?'#3ddc97':'#ff5c5c') + '">' + supabaseOK + '</span></div>';
}, 3000);
</script>
</body>
</html>
