<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Minimal Test</title>
</head>
<body style="background:#0b1220;color:#fff;font-family:monospace;padding:30px">
<div id="r">NO JS YET</div>

<script>
document.getElementById('r').textContent = 'Regular script ran'
</script>

<script type="module">
document.getElementById('r').textContent = 'Module script ran'

try {
  const React = await import('https://esm.sh/react@18.3.1')
  document.getElementById('r').textContent = 'React imported. Keys: ' + Object.keys(React).slice(0,5).join(',')
} catch (e) {
  document.getElementById('r').innerHTML = '<pre style="color:#ff5c5c">' + e.message + '\n\n' + e.stack + '</pre>'
}
</script>
</body>
</html>
